allowBuilds:
  '@nestjs/core': true
  '@playwright/browser-chromium': true
  '@swc/core': true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
