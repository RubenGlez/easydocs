packages:
  - 'packages/*'
  - 'apps/*'
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - minimatch@10.2.6
overrides:
  protobufjs: ^8.0.2
  glob: ^10.5.0
  minimatch: 10.2.6
  flatted: ^3.4.2
  js-yaml: ^4.1.1
  picomatch: ^2.3.2
  postcss: ^8.5.18
  brace-expansion: 5.0.8
  sharp: 0.35.3
  vite: ^8.0.16
  ws: ^8.20.1
  hono: ">=4.12.25"
  undici: "^7.28.0"
  form-data: ">=4.0.6"
  axios: ^1.18.0
  # onnxruntime-node pins adm-zip ^0.5.16 but the fix for GHSA-xcpc-8h2w-3j85
  # only landed in 0.6.0. Only reached from the private apps/evals tooling.
  adm-zip: ^0.6.0
allowBuilds:
  '@nestjs/core': true
  '@playwright/browser-chromium': true
  '@swc/core': true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
