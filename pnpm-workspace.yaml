  nanoid: ^3.3.18
  brace-expansion: 5.0.12
  sharp: 0.35.5
  vite: ^8.1.6
  ws: ^8.20.1
  hono: ">=4.12.25"
  undici: ^7.30.1
  form-data: ">=4.0.6"
  axios: ^1.20.0
  adm-zip: ^0.6.1
  socket.io-parser@>=4.0.0 <4.2.7: ^4.2.7
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  ip-address@>=10.0.0 <10.7.4: ^10.7.4
  browserslist@>=4.0.0 <4.28.7: ^4.28.7
  "@xmldom/xmldom@>=0.9.0 <0.9.12": ~0.9.12
  next@>=16.0.0 <16.4.1: ^16.4.1
  elysia@>=1.0.0 <1.4.29: ^1.4.29
  engine.io@>=6.0.0 <6.6.10: ^6.6.10
